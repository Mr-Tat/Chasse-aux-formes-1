<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>À la chasse aux formes</title>
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#172033; --muted:#667085; --line:#233044;
  --square:#2f6fed; --rectangle:#2aa876; --triangle:#ed8a2f; --disk:#8457d9; --none:#7b8494;
  --danger:#d64545; --success:#18845a; --shadow:0 12px 36px rgba(25,36,56,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(47,111,237,.35);outline-offset:3px}
.hidden{display:none!important}

.master-btn{position:fixed;left:8px;bottom:8px;z-index:50;width:28px;height:28px;border:1px solid rgba(35,48,68,.12);border-radius:8px;background:rgba(255,255,255,.16);color:rgba(23,32,51,.20);font-weight:900;font-size:12px;cursor:pointer;opacity:.42;transition:opacity .16s ease,background .16s ease,color .16s ease,border-color .16s ease;backdrop-filter:blur(2px)}
.master-btn:hover,.master-btn:focus-visible{opacity:.86;background:rgba(255,255,255,.72);color:rgba(23,32,51,.68);border-color:rgba(35,48,68,.22)}
.master-btn.active{opacity:.58;color:rgba(107,52,67,.72);border-color:rgba(107,52,67,.24);background:rgba(255,255,255,.42)}

#home{height:100dvh;display:grid;place-items:center;padding:24px;overflow:auto;background:
  radial-gradient(circle at 15% 15%,rgba(47,111,237,.10),transparent 30%),
  radial-gradient(circle at 85% 85%,rgba(132,87,217,.08),transparent 34%),#f7f9fc}
.home-card{width:min(900px,96vw);background:rgba(255,255,255,.92);border:1px solid #dfe5ee;border-radius:26px;box-shadow:var(--shadow);padding:34px 38px 38px}
.home-title{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:24px}
.home-title h1{font-size:clamp(28px,4vw,48px);line-height:1;margin:0;letter-spacing:-.03em}
.version{font-size:12px;color:var(--muted);font-weight:700}
.shape-intro{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:18px auto 32px;max-width:710px}
.intro-item{display:grid;place-items:center;gap:10px;color:#39445a;font-weight:750}
.intro-icon{width:82px;height:82px;border-radius:20px;background:#f7f9fc;display:grid;place-items:center;border:1px solid #e5e9f0}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.level-btn{border:0;border-radius:16px;padding:18px 16px;text-align:center;cursor:pointer;transition:.18s ease;min-height:86px;color:#fff;box-shadow:0 8px 18px rgba(34,48,68,.10)}
.level-btn[data-level="1"]{background:#B97A86}.level-btn[data-level="2"]{background:#925160}.level-btn[data-level="3"]{background:#6B3443}
.level-btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 11px 24px rgba(34,48,68,.16)}
.level-btn strong{display:block;font-size:18px;margin-bottom:5px}.level-btn span{display:block;color:rgba(255,255,255,.92);font-size:14px;font-weight:750}
.level-btn.locked{cursor:not-allowed;filter:saturate(.45) brightness(.82);box-shadow:none;opacity:.78}
.level-btn.locked:hover{transform:none;filter:saturate(.45) brightness(.82);box-shadow:none}
.level-btn .lock-line{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.055em}
.level-btn .lock-count{font-size:12px;margin-top:3px;color:rgba(255,255,255,.82)}
.level-btn .level-progress{display:block;font-size:12px;margin-top:5px;color:rgba(255,255,255,.86);font-weight:800;letter-spacing:.01em}
.level-btn.completed .level-progress{color:rgba(255,255,255,.96)}

#game{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:12px;gap:10px}
.topbar{min-height:46px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.menu-btn{border:1px solid #d9e0ea;background:#fff;color:#344054;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}
.progress{text-align:center;min-width:0}.progress strong{font-size:15px}.progress small{display:block;color:var(--muted);margin-top:2px}
.classified{justify-self:end;background:#fff;border:1px solid #d9e0ea;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:800;white-space:nowrap}

.game-layout{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:12px}
.scene-shell{position:relative;min-width:0;min-height:0;border:1px solid #d9e1ec;border-radius:20px;background:#fff;box-shadow:0 8px 28px rgba(28,40,60,.08);overflow:hidden;display:grid;place-items:center}
#sceneSvg{width:100%;height:100%;display:block;touch-action:manipulation;background:linear-gradient(180deg,#fbfcfe 0%,#f4f7fa 100%)}
.scene-shape{cursor:pointer;stroke:var(--line);stroke-width:3;vector-effect:non-scaling-stroke;transition:fill .16s ease,opacity .16s ease,stroke .16s ease,stroke-width .16s ease;fill:#fbfcfd}
.scene-shape:hover{filter:brightness(.985)}
.scene-shape.unclassified{stroke:#be7a20;stroke-width:5;stroke-dasharray:10 7}
.scene-shape.error{stroke:var(--danger);stroke-width:6}
.scene-shape.locked{cursor:default}
.reward-bg{opacity:0;transition:opacity .65s ease}.reward-mode .reward-bg{opacity:1}.reward-mode .scene-shape{transition:fill .75s ease,stroke .6s ease,filter .6s ease;filter:drop-shadow(0 2px 2px rgba(28,40,60,.12))}

.palette{min-height:0;background:#fff;border:1px solid #d9e1ec;border-radius:18px;box-shadow:0 8px 24px rgba(28,40,60,.06);padding:12px;display:flex;flex-direction:column;gap:10px}
.palette-title{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.cat-list{display:grid;gap:8px}
.cat-btn{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;width:100%;min-height:48px;border:1px solid #dce3ed;background:#fff;border-radius:12px;padding:6px 10px;cursor:pointer;text-align:left;color:#253044;font-weight:800;transition:.14s ease}
.cat-btn:hover{border-color:#b9c7da}.cat-btn.active{border-color:#8192aa;background:#f4f7fa;box-shadow:inset 0 0 0 2px rgba(47,111,237,.10)}
.icon-box{width:34px;height:34px;border-radius:9px;display:block;box-shadow:inset 0 0 0 1px rgba(31,42,58,.08)}
.status{min-height:68px;border-radius:12px;background:#f6f8fb;padding:10px 11px;color:#475467;font-size:13px;line-height:1.35;display:flex;align-items:center}
.status.error-text{background:#fff3f1;color:#963c34}.status.success-text{background:#eaf8f1;color:#176c4a;font-weight:700}
.actions{margin-top:auto;display:grid;gap:8px}.primary,.secondary,.continue{border:0;border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer}.primary{background:#202b3d;color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef2f6;color:#344054}.continue{background:#176f51;color:#fff;font-size:15px;box-shadow:0 8px 18px rgba(23,111,81,.20)}
.score-note{font-size:11px;color:#7b8494;text-align:center;line-height:1.25}

@media (max-width:860px){
 body{overflow:auto}
 #game{height:100dvh;min-height:650px}
 .game-layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 .palette{padding:9px;gap:8px}.palette-title{display:none}.cat-list{grid-template-columns:repeat(5,1fr);gap:6px}.cat-btn{grid-template-columns:1fr;place-items:center;gap:3px;min-height:60px;padding:5px 3px;text-align:center;font-size:10px}.icon-box{width:30px;height:30px}.status{min-height:44px;padding:7px 9px}.actions{grid-template-columns:1fr 1fr;margin-top:0}.continue{grid-column:1/-1}
}
@media (max-width:620px){
 #home{padding:12px}.home-card{padding:24px 18px}.shape-intro{grid-template-columns:repeat(2,1fr);gap:12px}.levels{grid-template-columns:1fr}.level-btn{min-height:70px}
 .topbar{grid-template-columns:auto 1fr}.classified{grid-column:1/-1;justify-self:center;margin-top:-5px}.progress{text-align:right}.cat-list{grid-template-columns:repeat(3,1fr)}
 #game{height:auto;min-height:100dvh}.scene-shell{min-height:42vh}.game-layout{grid-template-rows:minmax(360px,50vh) auto}
}
</style>
</head>

<section id="home">

      <div class="intro-item"><div class="intro-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="15" y="15" width="34" height="34" rx="3" fill="#2f6fed"/></svg></div><span>Carré</span></div>
      <div class="intro-item"><div class="intro-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="19" width="46" height="26" rx="3" fill="#2aa876"/></svg></div><span>Rectangle</span></div>
      <div class="intro-item"><div class="intro-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,11 54,51 10,51" fill="#ed8a2f"/></svg></div><span>Triangle</span></div>
      <div class="intro-item"><div class="intro-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="#8457d9"/></svg></div><span>Disque</span></div>
    </div>
    <div class="levels">
      <button class="level-btn" data-level="1" data-label="Formes isolées"><strong>Niveau 1</strong><span>Formes isolées</span></button>
      <button class="level-btn" data-level="2" data-label="Dessins composés"><strong>Niveau 2</strong><span>Dessins composés</span></button>
      <button class="level-btn" data-level="3" data-label="Dessins complexes"><strong>Niveau 3</strong><span>Dessins complexes</span></button>
    </div>
  </div>
</section>

<button id="masterBtn" class="master-btn" type="button" aria-label="Mode enseignant" title="Mode enseignant">M</button>

<section id="game" class="hidden">
  <header class="topbar">
    <button id="menuBtn" class="menu-btn">← Menu</button>
    <div class="progress"><strong id="progressTitle"></strong><small id="sceneTitle"></small></div>
    <div id="classifiedCount" class="classified">0 / 0 classées</div>
  </header>
  <main class="game-layout">
    <section class="scene-shell" aria-label="Zone de dessin">
      <svg id="sceneSvg" viewBox="0 0 960 540" role="img" aria-label="Dessin géométrique à classer"></svg>
    </section>
    <aside class="palette">
      <div class="palette-title">Choisis une catégorie</div>
      <div id="catList" class="cat-list"></div>
      <div id="status" class="status">Choisis une catégorie puis classe chaque zone.</div>
      <div class="actions">
        <button id="validateBtn" class="primary">Valider</button>
        <button id="clearBtn" class="secondary">Effacer</button>
        <button id="continueBtn" class="continue hidden"></button>
      </div>
      <div class="score-note">Le coloriage ne confirme pas la réponse. La correction se fait seulement avec « Valider ».</div>
    </aside>
  </main>
</section>

const masterBtn=document.getElementById('masterBtn');
const PROGRESS_KEY = "mathas_formes_progress_" + window.location.pathname.toLowerCase();
const MASTER_SESSION_KEY = "mathas_formes_master_session";
let masterMode=false;
try{masterMode=sessionStorage.getItem(MASTER_SESSION_KEY)==='1';}catch{}
const UNLOCK_REQUIREMENTS={2:{sourceLevel:1,needed:2},3:{sourceLevel:2,needed:3}};
let progress=loadProgress();
let state={level:1,order:[],index:0,selected:'square',answers:[],solved:false,firstCompleteValidated:false,firstAttemptPerfect:false,score:0,total:0,saved:false};

function loadProgress(){
 let data={perfect:{1:[],2:[],3:[]}};
 try{
   const saved=JSON.parse(localStorage.getItem(PROGRESS_KEY));
   if(saved&&saved.perfect){
     [1,2,3].forEach(level=>{
       if(Array.isArray(saved.perfect[level])) data.perfect[level]=[...new Set(saved.perfect[level].filter(v=>typeof v==='string'))];
     });
   }
 }catch{}
 return data;
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));}catch{}}
function perfectCount(level){return new Set(progress.perfect[level]||[]).size;}
function levelUnlocked(level){
 if(masterMode)return true;
 if(level===1)return true;
 const req=UNLOCK_REQUIREMENTS[level];
 return perfectCount(req.sourceLevel)>=req.needed;
}
function updateLevelButtons(){
 document.querySelectorAll('.level-btn').forEach(btn=>{
   const level=Number(btn.dataset.level),span=btn.querySelector('span');
   const unlocked=levelUnlocked(level);
   const done=Math.min(perfectCount(level),SCENES[level].length);
   const total=SCENES[level].length;
   btn.disabled=!unlocked;
   btn.classList.toggle('locked',!unlocked);
   btn.classList.toggle('completed',unlocked&&done===total);
   btn.setAttribute('aria-disabled',String(!unlocked));
   if(unlocked){
     span.className='';
     span.innerHTML=`${btn.dataset.label}<span class="level-progress">${done}/${total} réussis</span>`;
   }else{
     const req=UNLOCK_REQUIREMENTS[level];
     const n=Math.min(perfectCount(req.sourceLevel),req.needed);
     span.className='lock-line';
     span.innerHTML=`Bloqué <span class="lock-count">${n}/${req.needed}</span>`;
   }
 });
}
function recordPerfectExercise(){
 if(!state.firstAttemptPerfect)return false;
 const scene=currentScene();
 const key=scene.title;
 const list=progress.perfect[state.level]||(progress.perfect[state.level]=[]);
 if(list.includes(key))return false;
 list.push(key);saveProgress();updateLevelButtons();return true;
}

function updateMasterButton(){
 if(!masterBtn)return;
 masterBtn.classList.toggle('active',masterMode);
 masterBtn.setAttribute('aria-pressed',String(masterMode));
 masterBtn.title=masterMode?'Mode enseignant actif':'Mode enseignant';
}
function requestMasterMode(){
 if(masterMode)return;
 const entered=window.prompt('Mot de passe enseignant :');
 if(entered===null)return;
 if(entered==='Thecakeisalie'){
   masterMode=true;
   try{sessionStorage.setItem(MASTER_SESSION_KEY,'1');}catch{}
   updateMasterButton();
   updateLevelButtons();
   window.alert('Mode enseignant activé pour cette session. Tous les niveaux sont accessibles.');
 }else{
   window.alert('Mot de passe incorrect.');
 }
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function iconSvg(cat){
 const fill=COLORS[cat];
 if(cat==='square')return `<svg viewBox="0 0 28 28"><rect x="6" y="6" width="16" height="16" rx="1.5" fill="${fill}"/></svg>`;
 if(cat==='rectangle')return `<svg viewBox="0 0 28 28"><rect x="4" y="8" width="20" height="12" rx="1.5" fill="${fill}"/></svg>`;
 if(cat==='triangle')return `<svg viewBox="0 0 28 28"><polygon points="14,4 25,23 3,23" fill="${fill}"/></svg>`;
 if(cat==='disk')return `<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="9.5" fill="${fill}"/></svg>`;
 return `<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10" fill="none" stroke="${fill}" stroke-width="3"/><path d="M8 8 L20 20 M20 8 L8 20" stroke="${fill}" stroke-width="3" stroke-linecap="round"/></svg>`;
}

function selectCategory(cat){if(state.solved)return;state.selected=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));}

function startLevel(level){
 if(!levelUnlocked(level)){updateLevelButtons();return;}
 const mastered=new Set(progress.perfect[level]||[]);
 const unfinished=[],finished=[];
 SCENES[level].forEach((scene,i)=>(mastered.has(scene.title)?finished:unfinished).push(i));
 // Les exercices qui ne sont pas encore réussis à 100 % sont toujours proposés d'abord.
 const order=[...shuffle(unfinished),...shuffle(finished)];
 state={level,order,index:0,selected:'square',answers:[],solved:false,firstCompleteValidated:false,firstAttemptPerfect:false,score:0,total:SCENES[level].reduce((n,s)=>n+s.shapes.length,0),saved:false};
 home.classList.add('hidden');game.classList.remove('hidden');buildPalette();loadScene();
}

   }
   if(theme==='park'){
     add('rect',{x:365,y:388,width:84,height:12,rx:4,fill:'#99755d'});
     add('rect',{x:378,y:360,width:10,height:28,fill:'#7b8599'}); add('rect',{x:426,y:360,width:10,height:28,fill:'#7b8599'});
   }
 }
 svg.appendChild(g);
}
function createShape(shape,i){
 let el;
 if(shape.kind==='rect')el=makeEl('rect',{x:shape.x,y:shape.y,width:shape.w,height:shape.h,rx:shape.expected==='square'?2:1});
 if(shape.kind==='circle')el=makeEl('circle',{cx:shape.cx,cy:shape.cy,r:shape.r});
 if(shape.kind==='ellipse')el=makeEl('ellipse',{cx:shape.cx,cy:shape.cy,rx:shape.rx,ry:shape.ry});
 if(shape.kind==='polygon')el=makeEl('polygon',{points:shape.points});
 if(shape.rot){
   const cx=shape.kind==='rect'?shape.x+shape.w/2:shape.cx,cy=shape.kind==='rect'?shape.y+shape.h/2:shape.cy;
   el.setAttribute('transform',`rotate(${shape.rot} ${cx} ${cy})`);
 }
 el.classList.add('scene-shape');el.dataset.index=i;el.dataset.expected=shape.expected;el.dataset.reward=shape.reward||'#cbd5e1';el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',`Zone ${i+1}`);
 el.addEventListener('click',()=>paint(i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(i);}});
 return el;
}
function loadScene(){
 const scene=currentScene();state.answers=Array(scene.shapes.length).fill(null);state.solved=false;state.firstCompleteValidated=false;state.firstAttemptPerfect=false;
 svg.innerHTML='';svg.classList.remove('reward-mode');drawRewardBackground(scene.theme);
 scene.shapes.forEach((s,i)=>svg.appendChild(createShape(s,i)));
 progressTitle.textContent=`Niveau ${state.level} · Exercice ${state.index+1} / ${state.order.length}`;sceneTitle.textContent=scene.title;
 validateBtn.disabled=false;clearBtn.disabled=false;continueBtn.classList.add('hidden');
 setStatus('Choisis une catégorie puis classe chaque zone.');updateCount();fitScene();
}
function fitScene(){requestAnimationFrame(()=>{
 const shapes=[...svg.querySelectorAll('.scene-shape')];if(!shapes.length)return;
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 shapes.forEach(el=>{const b=el.getBBox();minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+b.width);maxY=Math.max(maxY,b.y+b.height);});
 const pad=42;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(960,maxX+pad);maxY=Math.min(540,maxY+pad);
 svg.setAttribute('viewBox',`${minX} ${minY} ${Math.max(100,maxX-minX)} ${Math.max(100,maxY-minY)}`);
});}
function paint(i){if(state.solved)return;state.answers[i]=state.selected;const el=svg.querySelector(`.scene-shape[data-index="${i}"]`);el.style.fill=COLORS[state.selected];el.classList.remove('error','unclassified');updateCount();}
function updateCount(){const n=state.answers.filter(Boolean).length;classifiedCount.textContent=`${n} / ${state.answers.length} classées`;}
function clearScene(){if(state.solved)return;state.answers.fill(null);svg.querySelectorAll('.scene-shape').forEach(el=>{el.style.fill='';el.classList.remove('error','unclassified');});setStatus('Exercice effacé. Tu peux recommencer.');updateCount();}
function validate(){
 if(state.solved)return;const scene=currentScene();const missing=state.answers.filter(a=>!a).length;
 svg.querySelectorAll('.scene-shape').forEach(el=>el.classList.remove('error','unclassified'));
 if(missing){state.answers.forEach((a,i)=>{if(!a)svg.querySelector(`.scene-shape[data-index="${i}"]`).classList.add('unclassified');});setStatus(`Il reste ${missing} zone${missing>1?'s':''} à classer.`,'error-text');return;}
 if(!state.firstCompleteValidated){let firstScore=0;scene.shapes.forEach((s,i)=>{if(state.answers[i]===s.expected)firstScore++;});state.score+=firstScore;state.firstAttemptPerfect=firstScore===scene.shapes.length;state.firstCompleteValidated=true;}
 let errors=0;scene.shapes.forEach((s,i)=>{if(state.answers[i]!==s.expected){errors++;svg.querySelector(`.scene-shape[data-index="${i}"]`).classList.add('error');}});
 if(errors){setStatus(`Il reste ${errors} erreur${errors>1?'s':''}. Corrige les zones entourées puis revalide.`,'error-text');return;}
 succeed();
}
function succeed(){
 state.solved=true;const scene=currentScene();svg.classList.add('reward-mode');svg.querySelectorAll('.scene-shape').forEach((el,i)=>{el.classList.remove('error','unclassified');el.classList.add('locked');el.style.fill=scene.shapes[i].reward||'#cbd5e1';el.style.stroke='#2a3446';});
 const newPerfect=recordPerfectExercise();
 let message=state.firstAttemptPerfect?'Bravo ! 100 % du premier coup.':'Bravo ! Tout est juste.';
 if(newPerfect&&state.level<3&&levelUnlocked(state.level+1))message+=` Niveau ${state.level+1} débloqué !`;
 setStatus(message,'success-text');validateBtn.disabled=true;clearBtn.disabled=true;
 const last=state.index===state.order.length-1;
 if(last){
   saveLevelResult();
   if(state.level<3&&levelUnlocked(state.level+1))continueBtn.textContent='OK, passer au niveau suivant';
   else if(state.level<3)continueBtn.textContent='OK, retour au menu';
   else continueBtn.textContent='OK, recommencer';
 } else continueBtn.textContent='OK, continuer';
 continueBtn.classList.remove('hidden');
}
function next(){
 const last=state.index===state.order.length-1;
 if(!last){state.index++;loadScene();return;}
 if(state.level<3&&levelUnlocked(state.level+1)){startLevel(state.level+1);return;}
 if(state.level===3){startLevel(3);return;}
 game.classList.add('hidden');home.classList.remove('hidden');updateLevelButtons();
}
function saveLevelResult(){if(state.saved)return;enregistrerScoreMathas(state.score,state.total,LEVELS[state.level].name);state.saved=true;}
function enregistrerScoreMathas(score, total, niveau) {
  const key = "mathas_scores_" + window.location.pathname.toLowerCase();
  let scores = [];
  try { scores = JSON.parse(localStorage.getItem(key)) || []; } catch { scores = []; }
  scores.unshift({ score, total, niveau, date: new Date().toISOString() });
  try { localStorage.setItem(key, JSON.stringify(scores.slice(0, 3))); } catch {}
}

document.querySelectorAll('.level-btn').forEach(b=>b.addEventListener('click',()=>startLevel(Number(b.dataset.level))));
document.getElementById('menuBtn').addEventListener('click',()=>{game.classList.add('hidden');home.classList.remove('hidden');updateLevelButtons();});
masterBtn.addEventListener('click',requestMasterMode);
validateBtn.addEventListener('click',validate);clearBtn.addEventListener('click',clearScene);continueBtn.addEventListener('click',next);
buildPalette();updateMasterButton();updateLevelButtons();
</script>
</body>
</html>
